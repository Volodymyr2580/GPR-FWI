[project]
name = "ifwi-gpr"
version = "0.1.0"
description = "Reproduction scaffold for implicit GPR full waveform inversion."
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "numba",
  "numpy",
  "scipy",
  "torch",
  "tqdm",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
