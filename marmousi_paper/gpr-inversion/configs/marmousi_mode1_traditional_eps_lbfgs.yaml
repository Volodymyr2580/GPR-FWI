name: marmousi_mode1_traditional_eps_lbfgs
migration_status: supported
source_path: ../traditional/mode1_LBFGS/main.py
model: marmousi
acquisition_mode: mode1
parameterization: traditional
inversion_strategy: eps_only
optimizer: lbfgs
illumination: false
fixed_top_rows: 10
snapshot_interval: 1000
data_path: ../traditional/mode1_LBFGS/modelv1.bin

regularization:
  tv:
    eps: 0.0
    sig: 0.0
  tikhonov:
    eps: 0.015
    sig: 0.0

training:
  learning_rate_eps: 0.02
  learning_rate_sig: 0.0
  lr_eps_stage2: 0.02
  num_epochs_stage1: 2001
  num_epochs_stage2: 0
  offset: 0.0

runtime:
  mpi_processes: 20
  device: cpu
  output_dir: outputs/marmousi/mode1_traditional_eps_lbfgs
  resume: false
  stage1_checkpoint_path: ""
