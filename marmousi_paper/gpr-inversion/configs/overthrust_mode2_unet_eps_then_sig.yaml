name: overthrust_mode2_unet_eps_then_sig
migration_status: supported
source_path: ../OverThrust_Tests/Unet/mode2/twopara_epsfirst.py
model: overthrust
acquisition_mode: mode2
parameterization: unet
inversion_strategy: eps_then_sig
optimizer: adam
illumination: true
fixed_top_rows: 10
snapshot_interval: 1000
data_path: data/overthrust/OverThrust.npy

regularization:
  tv:
    eps: 0.0
    sig: 5e-4
  tikhonov:
    eps: 0.0
    sig: 0.0

training:
  learning_rate_eps: 1e-4
  learning_rate_sig: 1e-5
  lr_eps_stage2: 1e-6
  num_epochs_stage1: 2500
  num_epochs_stage2: 12501
  alpha_l1_data: 0.0
  offset: 0.0

runtime:
  mpi_processes: 20
  device: cuda:0
  output_dir: outputs/overthrust/mode2_unet_eps_then_sig
  resume: false
  stage1_checkpoint_path: ""
